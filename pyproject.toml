[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-agent"
version = "0.1.0"
description = "A modular AI coding agent skeleton."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "gradio>=5.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
]

[project.scripts]
ai-coding-agent = "ai_coding_agent.ui.cli:main"
ai-coding-agent-server = "ai_coding_agent.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
